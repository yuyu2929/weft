name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 未纳入 macos-latest：本账号的 macOS runner 排队后 0 步取消（配额问题）
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: pytest tests/ -q
      - name: CLI 冒烟（build → info → verify）
        run: |
          python - <<'PY'
          import json, pathlib
          gj = {"type": "FeatureCollection", "features": [
              {"type": "Feature", "properties": {"name": "p1"},
               "geometry": {"type": "Polygon",
                            "coordinates": [[[0,0],[100,0],[100,100],[0,100],[0,0]]]}},
              {"type": "Feature", "properties": {"name": "s1"},
               "geometry": {"type": "Point", "coordinates": [50, 50]}}]}
          pathlib.Path("in.geojson").write_text(json.dumps(gj), encoding="utf-8")
          PY
          weft build in.geojson -o out.weft
          weft info out.weft
          weft verify out.weft
          weft query out.weft --layer polygons --x 50 --y 50
      - name: 演示脚本
        run: python scripts/demo.py
      - name: 许可证签发冒烟（社区版无证 → 企业功能报错）
        run: |
          python - <<'PY'
          from weft.enterprise import plan_shards
          from weft.license import LicenseError
          from weft import Weft, Layer
          w = Weft(10, 10, [Layer(name="p", kind="point")])
          w.add_point("p", 1, 1, {})
          w.commit()
          try:
              plan_shards(w, 2, lic=None)
          except LicenseError:
              print("门控正常：无证不可用企业功能")
          else:
              raise SystemExit("门控失效：无证竟然能分片")
          PY

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: 校验 wheel 内含公钥
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.endswith("weft/license_public.pem") for n in names), "wheel 缺少公钥"
          print("wheel ok:", whl, len(names), "files")
          PY
